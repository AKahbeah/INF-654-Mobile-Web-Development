<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2196f3"/>
  <title>TaskNest | Tasks</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json"/>
</head>
<body>
  <nav class="blue">
    <div class="nav-wrapper container">
      <a href="index.html" class="brand-logo">TaskNest</a>
      <ul class="right hide-on-med-and-down">
        <li><a href="tasks.html" class="active">Tasks</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="notes.html">Notes</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </div>
  </nav>

  <div class="container section">
    <h4>Your Tasks</h4>

    <div class="row">
      <form id="task-form" class="col s12">
        <div class="input-field">
          <input id="task-input" type="text" placeholder="Add a new task..." required />
          <label for="task-input">New Task</label>
        </div>
        <button type="submit" class="btn blue waves-effect waves-light">
          <i class="material-icons">add</i>
        </button>
      </form>
    </div>

    <ul id="task-list" class="collection"></ul>
  </div>

  <footer class="page-footer blue lighten-1">
    <div class="container center-align white-text">
      &copy; 2025 TaskNest
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="app.js"></script>
  <script>
    (async function(){
      // Wait until our StorageManager is loaded by app.js (it injects the helper scripts)
      function waitForStorage(timeout = 5000){
        const start = Date.now();
        return new Promise((resolve, reject) => {
          (function poll(){
            if (window.StorageManager && window.IDBHelper) return resolve();
            if (Date.now() - start > timeout) return reject(new Error('StorageManager not available'));
            setTimeout(poll, 100);
          })();
        });
      }

      try {
        await waitForStorage();
      } catch (err) {
        console.warn('Storage helpers not loaded, falling back to localStorage', err);
      }

      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const list = document.getElementById('task-list');

      let tasks = [];

      async function load() {
        if (window.StorageManager) tasks = await StorageManager.getAllTasks();
        else tasks = JSON.parse(localStorage.getItem('tasknest_tasks')) || [];
        renderTasks();
      }

      function renderTasks() {
        list.innerHTML = '';
        tasks.forEach((task) => {
          const li = document.createElement('li');
          li.className = 'collection-item';
          li.dataset.id = task.id || '';
          li.innerHTML = `
            <label>
              <input type="checkbox" ${task.done ? 'checked' : ''} data-id="${task.id || ''}" />
              <span style="${task.done ? 'text-decoration: line-through;' : ''}">${task.text}</span>
              <i class="material-icons secondary-content delete-task" data-id="${task.id || ''}"
                 style="cursor: pointer;">delete</i>
            </label>
          `;
          list.appendChild(li);
        });
      }

      async function saveLocalFallback(){
        localStorage.setItem('tasknest_tasks', JSON.stringify(tasks));
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        const newRec = { text, done: false };
        if (window.StorageManager) {
          const saved = await StorageManager.createTask(newRec);
          tasks.push(saved);
        } else {
          // fallback
          newRec.id = 'loc-' + Date.now();
          tasks.push(newRec);
          saveLocalFallback();
        }
        input.value = '';
        renderTasks();
      });

      list.addEventListener('click', async e => {
        if (e.target.matches('input[type="checkbox"]')) {
          const id = e.target.dataset.id;
          const idx = tasks.findIndex(t=>t.id==id);
          if (idx === -1) return;
          tasks[idx].done = !tasks[idx].done;
          if (window.StorageManager) {
            await StorageManager.updateTask(tasks[idx].id, tasks[idx]);
          } else {
            saveLocalFallback();
          }
          renderTasks();
        }
        if (e.target.classList.contains('delete-task')) {
          const id = e.target.dataset.id;
          const idx = tasks.findIndex(t=>t.id==id);
          if (idx === -1) return;
          const toDelete = tasks.splice(idx,1)[0];
          if (window.StorageManager) {
            await StorageManager.deleteTask(toDelete.id);
          } else {
            saveLocalFallback();
          }
          renderTasks();
        }
      });

      await load();
    })();
  </script>
</body>
</html>
